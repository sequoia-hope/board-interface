[package]
name = "board-interface"
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/sequoia-hope/board-interface"
description = "Shared PCB shape DXF R12 + manifest reader, writer, nanometre geometry hash, and handover comparison for Waffle Iron and Circuit Composer."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
